    </defs>
    
    <rect width="1280" height="800" fill="url(#oceanBg)"/>
    
    <!-- Top Window Chrome -->
    <rect x="30" y="30" width="1220" height="48" rx="8" fill="#0F243E" stroke="#1D3E64"/>
    <circle cx="55" cy="54" r="6" fill="#FF5F56"/>
    <circle cx="75" cy="54" r="6" fill="#FFBD2E"/>
