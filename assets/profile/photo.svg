<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161A30"/>
      <stop offset="100%" stop-color="#0E1020"/>
    </linearGradient>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,181,71,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#avatarBg)"/>
  <rect width="800" height="1000" fill="url(#smallGrid)"/>
  
  <!-- Corner Crosshairs -->
  <path d="M 40 60 L 80 60 M 60 40 L 60 80" stroke="#FFB547" stroke-width="2"/>
  <path d="M 720 60 L 760 60 M 740 40 L 740 80" stroke="#FFB547" stroke-width="2"/>
  <path d="M 40 940 L 80 940 M 60 920 L 60 960" stroke="#FFB547" stroke-width="2"/>
  <path d="M 720 940 L 760 940 M 740 920 L 740 960" stroke="#FFB547" stroke-width="2"/>

  <!-- Arch Frame Contour -->
  <path d="M 120 400 C 120 220, 260 140, 400 140 C 540 140, 680 220, 680 400 L 680 860 L 120 860 Z" fill="none" stroke="#FFB547" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Stylized Engineer Silhouette -->
  <circle cx="400" cy="380" r="130" fill="none" stroke="#F2EFE8" stroke-width="3"/>
  <path d="M 240 760 C 240 590, 560 590, 560 760" fill="none" stroke="#F2EFE8" stroke-width="3"/>
  
  <!-- Monogram & Badge -->
  <text x="400" y="420" font-family="'Fraunces', serif" font-size="90" font-weight="bold" fill="#FFB547" text-anchor="middle">G.</text>
  <text x="400" y="820" font-family="'JetBrains Mono', monospace" font-size="14" fill="#A9AECB" text-anchor="middle" letter-spacing="2">GAURANG UPADHYAY &bull; VJTI MUMBAI</text>
  <text x="400" y="850" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFB547" text-anchor="middle">[ PORTRAIT PHOTO PLACEHOLDER &bull; MILESTONE A ]</text>
</svg>